<!DOCTYPE html>
<html lang="zh-TW">
<head>
	<meta charset="utf-8" />
	<meta name="robots" content="noindex" />
	<title>強力大磁鐵 Blog 已搬家 | MEGAFORCE</title>
	<link rel="canonical" href="https://megaforce.audio/blog/" />
	<script>
		// blog.megaforce.audio (old WordPress, plain permalinks) -> megaforce.audio/blog/
		(function () {
			var base = location.protocol + '//megaforce.audio/blog/'; // keep http/https of the visitor
			var posts = [55,109,115,120,124,134,157,169,185,194,218,245,258,285,317,328,332,372,388,439,471,486,530,539,549,552,626,644];
			var q = new URLSearchParams(location.search);
			var p = parseInt(q.get('p'), 10);
			var cat = q.get('cat');
			var target = base;
			if (posts.indexOf(p) >= 0) { target = base + 'post-' + p + '.html'; }
			else if (cat && /^\d+$/.test(cat)) { target = base + '#cat-' + cat; }
			location.replace(target);
		})();
	</script>
	<noscript><meta http-equiv="refresh" content="0; url=//megaforce.audio/blog/" /></noscript>
</head>
<body>
	<p>強力大磁鐵 Blog 已搬到 <a href="https://megaforce.audio/blog/">megaforce.audio/blog</a>，正在為您轉址…</p>
</body>
